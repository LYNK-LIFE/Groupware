<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>홈</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/expiredcustomer.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body> <!-- 최초 메인 페이지 -->

<nav th:replace="~{common/nav :: navFragment}" class="nav-class"></nav>

<!-- 헤더 영역(달력) -->
<div class="right-container">
    <header th:replace="~{common/header :: headerFragment}"></header>

    <section class="main-content mainPageSection">
        <article class="board-section box1">
            <!-- 공지사항 영역 -->
            <span class="articleName">공지사항</span>
            <hr class="custom-hr">
        </article>
        <article class="maturity-section box2">
            <!-- 만기 도래 고객 목록 영역 -->
            <span class="articleName">만기 도래 고객</span>
            <hr class="custom-hr">
            <div class="expiring-contracts" >
                <div class="header">

                </div>
                <div id="contract-list" class="contract-list">
                    <!-- Contract cards will be dynamically added here -->
                </div>
            </div>

        </article>
        <article class="notify-section box3">
            <!-- 알림 영역 -->
            <span class="articleName">알림</span>
            <hr class="custom-hr">
        </article>
        <article class="resultPresentCondition-section box4">
            <!-- 실적 현황표 영역 -->
            <span class="articleName">금월 영업 실적 현황판</span>
            <hr class="custom-hr">
        </article>
    </section>

    <aside th:replace="~{common/aside :: asideFragment}" class="aside-class"></aside>
    <footer th:replace="~{common/footer :: footerFragment}" class="footer-class"></footer>
</div>

<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/calendar.js}"></script>
<script th:src="@{/js/expiredcustomer.js}"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>


</body>
</html>
