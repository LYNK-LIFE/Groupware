<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>기안서 상세보기</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/notice.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>

<nav th:replace="~{common/nav :: navFragment}" class="nav-class"></nav>
<script src="/js/common.js"></script>

<div class="right-container">
    <header th:replace="~{common/header :: headerFragment}"></header>
    <script src="/js/calendar.js"></script>

    <section class="main-content">

        <div class="subHeader-class">
            <a class="subHeaderLink-class" href="/approval/doapproval"></a>
        </div>

        <article class="main-content">
            <div class="notice-scroll-container">

                <div class="notice-title-container">
                    <span class="notice-title-label">제목 : </span>
                    <h2 class="notice-title" th:text="${draft.draftTitle}"></h2>
                </div>
                <div class="notice-info">
                    <span class="info-item">번호: <span th:text="${draft.draftNo}"></span></span>
                    <span class="info-item">작성일자: <span th:text="${#temporals.format(draft.draftDate, 'yyyy-MM-dd HH:mm')}"></span></span>
                    <span class="info-item">작성자: <span th:text="${draft.employeeName}"></span></span>
                    <span class="info-item">결재상태: <span th:text="${draft.draftState == 0 ? '미확인' : '확인'}"></span></span>
                    <span class="info-item">결재일자: <span th:text="${#temporals.format(draft.draftCompletionTime, 'yyyy-MM-dd HH:mm')}"></span></span>
                    <span class="info-item">현재단계: <span th:text="${draft.draftCurrentStep}"></span></span>
                    <span class="info-item">최종단계: <span th:text="${draft.draftLastStep}"></span></span>
                </div>

                <p>내용</p>
                <div class="notice-content" th:utext="${draft.draftMemo}"></div>

                <div th:if="${state < 2}" style="margin-top: 10px;">
                    <a th:href="@{/approval/{draftNo}/check(draftNo=${draft.draftNo})}" class="btn btn-primary mb-3">확인</a>
                    <a th:href="@{/approval/{draftNo}/approve(draftNo=${draft.draftNo})}" class="btn btn-primary mb-3">승인</a>
                    <a th:href="@{/approval/{draftNo}/reject(draftNo=${draft.draftNo})}" class="btn btn-primary mb-3">반려</a>
                </div>
                <a th:href="@{${draft.draftState == 2 ? '/approval/list/findraft' :
                    (draft.draftState == 9 ? '/approval/list/dindraft' : '/approval/list/ondraft')}}"
                   class="btn btn-primary mb-3">목록으로 돌아가기</a>
            </div>
        </article>
    </section>

    <aside th:replace="~{common/aside :: asideFragment}" class="aside-class"></aside>
    <footer th:replace="~{common/footer :: footerFragment}" class="footer-class"></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>


</body>
</html>
