<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>직원 목록</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
<div class="container">
    <h1>직원 목록</h1>
    <button type="button" class="btn btn-primary" data-toggle="modal" data-target="#employeeModal">
        직원 선택
    </button>

    <!-- 모달 -->
    <div class="modal fade" id="employeeModal" tabindex="-1" role="dialog" aria-labelledby="employeeModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="employeeModalLabel">직원 선택</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <ul id="employeeTree">
                        <li th:each="department : ${departments}">
                            <span th:text="${department.name}"></span>
                            <ul>
                                <li th:each="employee : ${department.employees}">
                                    <input type="checkbox" th:value="${employee.id}" th:text="${employee.name}">
                                </li>
                            </ul>
                        </li>
                    </ul>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">닫기</button>
                    <button type="button" class="btn btn-primary" onclick="saveSelectedEmployees()">저장</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
<script>
    function saveSelectedEmployees() {
        var selectedEmployees = [];
        $('input[type=checkbox]:checked').each(function() {
            selectedEmployees.push($(this).val());
        });
        console.log('선택된 직원:', selectedEmployees);
        $('#employeeModal').modal('hide');
    }
</script>
</body>
</html>
