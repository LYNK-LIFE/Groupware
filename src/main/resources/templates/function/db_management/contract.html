<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>신 계약등록</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>


<body>
<nav th:replace="~{/common/nav :: navFragment}" class="nav-class"></nav>

<!-- 헤더 영역(달력) -->
<div class="right-container">
    <header th:replace="~{/common/header :: headerFragment}" class="header-class"></header>


    <section class="main-content">

        <div class="subHeader-class">
            <a class="subHeaderLink-class" href="/">DB관리</a>
            <label style="margin-left: 20px; margin-right: 20px"> > </label>
            <a class="subHeaderLink-class" href="/db/contract">신계약 등록</a>
        </div>

        <article>
            <div class="form-container">
                <h1>신 계약 등록</h1>


                <form action="/db/contract" method="POST">

                    <!-- 설계사명 -->
                    <div class="form-group">
                        <label for="employeeName">설계사명</label>
                        <input type="text" id="employeeName" name="employeeName" class="form-control" readonly>
                        <input type="hidden" id="employeeNo" name="employeeNo"> <!-- 사번 저장 -->
                        <button type="button" id="searchEmployeeBtn" class="btn btn-primary">조회</button>
                    </div>

                    <!-- 설계사 모달창 -->
                    <div class="modal fade" id="employeeModal" tabindex="-1" aria-labelledby="employeeModalLabel" aria-hidden="true" >
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title" id="employeeModalLabel">설계사 목록</h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                </div>
                                <div class="modal-body">
                                    <input type="text" id="employeeSearch" class="form-control" placeholder="설계사 이름 검색">
                                    <ul id="employeeList" class="list-group mt-3">
                                        <!-- 설계사 목록이 동적으로 추가됩니다 -->
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>



                    <!-- 납입일 -->
                    <div class="form-group">
                        <label for="paymentDay">납입일예정일</label>
                        <select id="paymentDay" name="paymentDay" required>
                            <option value="1">일시납</option>
                            <option value="5">5일</option>
                            <option value="10">10일</option>
                            <option value="15">15일</option>
                            <option value="20">20일</option>
                            <option value="25">25일</option>
                        </select>
                    </div>


                    <!-- 고객 선택 모달 -->
                    <div class="modal fade" id="customerModal" tabindex="-1" aria-labelledby="customerModalLabel" aria-hidden="true">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title" id="customerModalLabel">고객 목록</h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                </div>
                                <div class="modal-body">
                                    <input type="text" id="customerSearch" class="form-control" placeholder="고객 이름 검색">
                                    <ul id="customerList" class="list-group mt-3">
                                        <!-- 고객 데이터가 여기에 추가됩니다 -->
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 고객명 -->
                    <div class="form-group">
                        <label for="customerName">고객명</label>
                        <input type="text" id="customerName" name="customerName" readonly>
                        <button type="button" id="searchCustomerBtn" class="btn btn-primary">조회</button>
                    </div>

                    <!-- 주민등록번호 -->
                    <div class="form-group">
                        <label for="customerSsn">주민등록번호</label>
                        <input type="text" id="customerSsn" name="customerSsn" class="form-control" required>

                    </div>
                    <!--  숨겨진 고객번호 필드  -->
                    <input type="hidden" id="customerNo" name="customerNo">

                    <!-- 이메일 -->
                    <div class="form-group">
                        <label for="customerEmail">이메일</label>
                        <input type="email" id="customerEmail" name="customerEmail" readonly>
                    </div>

                    <!-- 연락처 -->
                    <div class="form-group">
                        <label for="customerMobile">연락처</label>
                        <input type="text" id="customerMobile" name="customerMobile" readonly>
                    </div>

                    <!-- 피보험자 -->
                    <div class="form-group">
                        <label for="insuredName">피보험자</label>
                        <input type="text" id="insuredName" name="insuredName" required>
                    </div>

                    <!-- 피보험자 주민번호 -->
                    <div class="form-group">
                        <label for="insuredSsn">피보험자 주민번호</label>
                        <input type="text" id="insuredSsn" name="insuredSsn" required>
                    </div>

                    <!-- 보험회사명코드 -->
                    <div class="form-group">
                        <label for="insuranceCode">보험회사</label>
                        <select id="insuranceCode" name="insuranceCode" class="form-select">
                            <!-- 옵션은 JavaScript에서 동적으로 추가 -->
                        </select>
                    </div>

                    <!-- 계약일자 -->
                    <div class="form-group">
                        <label for="contractDate">계약일자</label>
                        <input type="date" id="contractDate" name="contractDate" required>
                    </div>

                    <!-- 계약번호 -->
                    <div class="form-group">
                        <label for="contractNo">계약번호</label>
                        <input type="text" id="contractNo" name="contractNo" required>
                    </div>


                    <!-- 상품 -->
                    <div class="form-group mt-3">
                        <label for="productName">상품</label>
                        <input type="text" id="productName" name="productName" class="form-control" required>
                        <input type="hidden" id="productNo" name="productNo">
                        <button type="button" id="searchProductBtn" class="btn btn-primary">상품 조회</button>
                    </div>

                    <!--상품조회 모달창-->
                    <div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title" id="productModalLabel">상품 목록</h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                </div>
                                <div class="modal-body">
                                    <ul id="productList" class="list-group"></ul>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 기본결제수단 -->
                    <div class="form-group mt-3">
                        <label for="paymentMethod">기본 결제수단</label>
                        <select id="paymentMethod" name="basicPayWith" class="form-select">
                            <option value="카드">카드</option>
                            <option value="자동이체">자동이체</option>
                            <option value="직원수납">직원수납</option>
                        </select>
                    </div>

                    <!-- 계약기간 -->
                    <div class="form-group">
                        <label for="contractDuration">계약기간</label>
                        <div class="radio-group">
                            <input type="number" id="contractDuration" name="contractDuration" required>
                            <label>년</label>
                        </div>
                    </div>

                    <!-- 납입금액 -->
                    <div class="form-group">
                        <label for="eachPayment">납입금액</label>
                        <input type="number" id="eachPayment" name="eachPayment" required>
                        <label>원</label>
                    </div>

                    <!-- 납입주기 -->
                    <div class="form-group">
                        <label for="paymentTerm">납입주기</label>
                        <select id="paymentTerm" name="paymentTerm" required>
                            <option value="1">1년</option>
                            <option value="5">5년</option>
                            <option value="10">10년</option>
                            <option value="20">20년</option>
                            <option value="30">30년</option>
                        </select>
                    </div>


                    <!-- 기타사항 -->
                    <div class="form-group">
                        <label for="otherMatters">기타사항</label>
                        <textarea id="otherMatters" name="otherMatters"></textarea>
                    </div>

                    <!-- 버튼 -->
                    <div class="form-group">
                        <button type="button" id="registerContractBtn">등록하기</button>
                    </div>
                </form>
            </div>
        </article>
        <!--확인모달-->
        <div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="confirmModalLabel">확인</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        신규계약을 전산에 등록 할려고합니다. 등록하시겠습니까?
                    </div>
                    <div class="modal-footer">
                        <button type="submit" id="confirmYes" class="btn-btn-primary">확인</button>
                        <button type="button" id="confirmNo" class="btn-secondary" data-bs-dismiss="modal">취소</button>
                    </div>
                </div>
            </div>
        </div>

        <!--저장완료 모달-->
        <div id="resultModal" class="modal fade" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">알림</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <p id="resultMessage"></p>
                    </div>
                    <div class="modal-footer">
                        <button id="completionConfirm" class="btn btn-primary">확인</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- 오류 모달 -->
        <div id="errorModal" class="modal fade" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">오류</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <p id="errorMessage"></p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
                    </div>
                </div>
            </div>
        </div>

    </section>

    <aside th:replace="~{common/aside :: asideFragment}" class="aside-class"></aside>
    <footer th:replace="~{common/footer :: footerFragment}" class="footer-class"></footer>

</div>


<!-- ① Popper.js 라이브러리 - 툴팁 , 팝오버 , 드롭다운 관리 -->

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>

<!-- ② Popper.js를 필요로 함 - 자바스크립트 파일 로드 - UI 구성 요소 쉽게 만들어줌 - 드롭다운 , 모달 -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
        integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
        crossorigin="anonymous"></script>


<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/calendar.js}"></script>
<script th:src="@{/js/contract.js}"></script>
<script th:src="@{/js/expiredcustomer.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>
